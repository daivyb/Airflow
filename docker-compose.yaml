# =============================================================
# Docker Compose — Airflow ETL Profonanpe
# Executor: LocalExecutor  |  Backend: PostgreSQL 15
# =============================================================

x-airflow-common: &airflow-common
  build: .
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW_CONN_SQLSERVER_ORIGEN: ${AIRFLOW_CONN_SQLSERVER_ORIGEN}
    AIRFLOW_CONN_SQLSERVER_DW: ${AIRFLOW_CONN_SQLSERVER_DW}
    
    AIRFLOW_VAR_VTRACK_USER: ${AIRFLOW_VAR_VTRACK_USER}
    AIRFLOW_VAR_VTRACK_PASS: ${AIRFLOW_VAR_VTRACK_PASS}
    AIRFLOW_VAR_VTRACK_URL: ${AIRFLOW_VAR_VTRACK_URL}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./data:/opt/airflow/data
    - /var/run/docker.sock:/var/run/docker.sock
  depends_on:
    postgres:
      condition: service_healthy

services:
  # ----- PostgreSQL (Airflow metadata) -----
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----- Airflow Init (migrate DB + create admin user) -----
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true
    restart: "no"

  # ----- Airflow Webserver + Scheduler -----
  airflow:
    <<: *airflow-common
    command: bash -c "airflow scheduler & airflow webserver"
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres_data:
